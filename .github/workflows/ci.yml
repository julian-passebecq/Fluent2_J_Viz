name: VizForge web engine
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run browser:install -- --with-deps
      - run: npm run check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vizforge-production-proof
          path: |
            playwright-report/
            test-results/
            docs/qa/
